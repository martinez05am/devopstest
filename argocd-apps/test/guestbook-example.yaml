# Example: Guestbook Application for Test Environment
# This is a reference template. Copy and modify for your applications.
# Note: Typically test environment uses more conservative sync policies

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook-test
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/argoproj/argocd-example-apps.git
    targetRevision: HEAD
    path: guestbook
  destination:
    server: https://kubernetes.default.svc
    namespace: test
  syncPolicy:
    # Manual sync for test environment
    syncOptions:
    - CreateNamespace=true

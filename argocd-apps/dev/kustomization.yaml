apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# References to base and environment-specific resources
resources:
- ../base

# Resources specific to dev environment
# Add your dev applications here
# Example: guestbook-app.yaml
- ../dev
# - guestbook-dev.yaml
# - guestbook-dev-amm.yaml

# Namespace override for dev
namespace: dev

# Environment-specific labels
commonLabels:
  environment: dev

# Environment-specific annotations
commonAnnotations:
  environment: dev

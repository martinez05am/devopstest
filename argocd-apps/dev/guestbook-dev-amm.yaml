# Example: Guestbook Application for Dev Environment
# This is a reference template. Copy and modify for your applications.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook-dev-amm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/argoproj/argocd-example-apps.git
    targetRevision: HEAD
    path: guestbook
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
